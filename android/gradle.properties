# receive_sharing_intent 1.8.1's own Android module sets Java 1.8 while its
# Kotlin compile task targets a newer JVM (toolchain-inferred), and root-level
# task overrides don't stick due to this project's evaluationDependsOn(":app")
# ordering. Downgrading Kotlin's JVM-target check from a hard error to a
# warning is the standard mitigation for this class of third-party-plugin
# mismatch (the actual bytecode mismatch is harmless on Android/ART in
# practice). Safe to remove once receive_sharing_intent fixes this upstream.
kotlin.jvm.target.validation.mode=warning
